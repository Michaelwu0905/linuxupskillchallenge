# Project information
site_name: Linux Upskill Challenge（中文版）
site_url: https://linuxupskillchallenge.org/
site_author: Livia Lima
site_description: >-
  一门为期一个月的课程，面向希望在行业中从事 Linux 相关工作的学习者 —— 初级 Linux 系统管理员、DevOps 相关工作等。
  学习从命令行管理远程 Linux 服务器所需的技能。（本文件用于构建中文版站点，内容位于 docs_zh/）

# Repository
repo_name: livialima/linuxupskillchallenge
repo_url: https://github.com/livialima/linuxupskillchallenge
edit_uri: blob/master/docs_zh

# Copyright
copyright: Copyright &copy; 2012-2019 Steve Brorens (@snori74) <br> Open Source since 2020 under the terms of the Creative Commons Attribution 4.0 International License (CC BY 4.0).

# Where the translated content lives
docs_dir: docs_zh
site_dir: site_zh

# Extensions
markdown_extensions:
  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - codehilite
  - def_list
  - footnotes
  - md_in_html
  - sane_lists
  - smarty
  - toc:
      toc_depth: 4

  # Python Markdown Extensions
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Configuration
theme:
  name: material
  custom_dir: overrides
  language: zh
  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - navigation.expand
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/lightbulb
        name: 切换到深色模式
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/lightbulb-outline
        name: 切换到浅色模式
  font:
    text: Ubuntu
    code: Ubuntu Mono
  favicon: luc.png
  logo: luc.png

# Plugins
plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'

# Customization
extra:
  annotate:
    json: [.s2]
  social:
    - icon: fontawesome/brands/discord
      link: https://discord.gg/linux-upskill-challenge-682046666928685068
      name: discord 聊天
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@livia2lima/search?query=linux%20upskill%20challenge
      name: 配套视频
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/livialima/
      name: livialima @linkedin
    - icon: fontawesome/brands/github
      link: https://github.com/livialima
      name: livialima @github
    - icon: fontawesome/brands/mastodon
      link: https://fosstodon.org/@livialima
      name: livialima @fosstodon

